<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐡 דג הבלון</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
    background: #001020;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}
canvas { display:block; position:fixed; top:0; left:0; z-index:1; }

.hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; z-index: 10; pointer-events: none;
}
.hud-right, .hud-left { display:flex; gap:8px; align-items:center; }
.hud-item {
    background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 50px;
    padding: 5px 14px; color: #fff; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 5px;
}
#pause-btn {
    pointer-events: auto; cursor: pointer;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
}

.overlay {
    position: fixed; inset: 0; color: white;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; gap: 10px;
}
.overlay.show { display: flex; }

#lobby {
    background: linear-gradient(180deg, #000d22 0%, #002045 60%, #003060 100%);
}
#lobby h1 { font-size: 44px; text-shadow: 0 0 30px rgba(99,102,241,0.5); }
#lobby .sub { color: rgba(255,255,255,0.45); font-size: 13px; margin-bottom: 14px; }
#lobby .saved-coins {
    color: #ffd700; font-size: 20px; background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.2); border-radius: 50px; padding: 6px 20px;
}

.btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white; border: none; padding: 13px 36px; font-size: 16px; font-weight: 700;
    border-radius: 14px; cursor: pointer; min-width: 200px;
    box-shadow: 0 4px 16px rgba(99,102,241,0.2);
}
.btn:hover { box-shadow: 0 6px 20px rgba(99,102,241,0.35); transform: translateY(-1px); }
.btn:active { transform: scale(0.95); }
.btn-secondary {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
}

#shop, #ability-shop, #settings, #gameover, #pause-screen, #level-complete {
    background: rgba(0,0,20,0.9); backdrop-filter: blur(12px);
}

/* Add more styles if needed - core ones kept */
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby" class="overlay show">
    <h1>🐡 דג הבלון</h1>
    <p class="sub">אסוף דגים • היזהר מכרישים • הילחם בבוס</p>
    <p class="saved-coins">💰 <span id="lobby-coins">0</span> מטבעות</p>
    
    <button class="btn" onclick="startGame()">🎮 התחל משחק</button>
    <button class="btn btn-shop" onclick="openShop()">🛒 חנות סקינים</button>
    <button class="btn btn-ability" onclick="openAbilityShop()">⚡ חנות יכולות</button>
    <button class="btn btn-secondary" onclick="openSettings()">⚙️ הגדרות</button>
</div>

<!-- GAME OVER -->
<div id="gameover" class="overlay">
    <h2>💀 נפסלת!</h2>
    <p>ניקוד <span id="go-score">0</span> &nbsp;&nbsp; שלב <span id="go-level">1</span></p>
    <p class="earned">+<span id="go-earned">0</span> 🪙</p>
    <p>סה״כ מטבעות <span id="go-total">0</span></p>
    <button class="btn" onclick="startGame()">🔄 שחק שוב</button>
    <button class="btn btn-secondary" onclick="goLobby()">🏠 לובי</button>
</div>

<!-- PAUSE -->
<div id="pause-screen" class="overlay">
    <h2>⏸️ השהייה</h2>
    <button class="btn" onclick="resumeGame()">▶️ המשך</button>
    <button class="btn btn-secondary" onclick="quitToLobby()">🏠 חזור ללובי</button>
</div>

<!-- LEVEL COMPLETE -->
<div id="level-complete" class="overlay">
    <h2>🎉 כל הכבוד!</h2>
    <div class="level-num" id="lc-level">2</div>
    <p class="level-reward">+<span id="lc-reward">0</span> 🪙 בונוס</p>
    <p id="lc-msg">עברת את השלב!</p>
    <button class="btn" onclick="dismissLevelComplete()">🚀 המשך למשחק</button>
</div>

<!-- SHOP -->
<div id="shop" class="overlay">
    <h2>🛒 חנות סקינים</h2>
    <p class="shop-coins">💰 <span id="shop-coins">0</span> מטבעות</p>
    <h3>🐡 סקין דג בלון</h3>
    <div class="skin-grid" id="skin-grid"></div>
    <button class="btn btn-secondary" onclick="closeShop()">חזור</button>
</div>

<!-- ABILITY SHOP -->
<div id="ability-shop" class="overlay">
    <h2>⚡ חנות יכולות</h2>
    <p class="shop-coins">💰 <span id="ability-shop-coins">0</span> מטבעות</p>
    <div class="ability-grid" id="ability-grid"></div>
    <button class="btn btn-secondary" onclick="closeAbilityShop()">חזור</button>
</div>

<!-- SETTINGS -->
<div id="settings" class="overlay">
    <h2>⚙️ הגדרות</h2>
    <button class="btn btn-secondary" onclick="closeSettings()">חזור</button>
</div>

<!-- HUD -->
<div class="hud" id="hud" style="display:none;">
    <div class="hud-left">
        <div class="hud-item hud-coins">🪙 <span id="hud-coins">0</span></div>
        <div class="hud-item hud-score">⭐ <span id="hud-score">0</span></div>
        <div class="hud-item hud-level">שלב <span id="hud-level">1</span></div>
    </div>
    <div class="hud-right">
        <div id="pause-btn" onclick="togglePause()">⏸</div>
    </div>
</div>

<canvas id="game"></canvas>

<script>

    equippedAbilities: []

function saveData() { localStorage.setItem('puff_save', JSON.stringify(gameData)); }
function loadData() {
    const saved = localStorage.getItem('puff_save');

    }

loadData();

    document.getElementById('shop-coins').textContent = gameData.coins;
    renderShop();

    document.getElementById('shop').classList.remove('show');

    const grid = document.getElementById('skin-grid');

    // Render skins logic here (same as original)

}

// Ability shop, settings, etc. kept minimal

// Game variables
let player, fishList = [], sharks = [], boss = null;
let score = 0, earnedCoins = 0, level = 1;

// ... (rest of game logic - movement, drawing, collision, etc.)

function startGame() {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
    document.getElementById('hud').style.display = 'flex';
    // init game state...
    gameRunning = true;
    // game loop
}

function die() {
    gameRunning = false;
    document.getElementById('hud').style.display = 'none';
    gameData.coins += earnedCoins;
    saveData();
    document.getElementById('go-score').textContent = score;
    document.getElementById('go-level').textContent = level;

}

function goLobby() {
    document.getElementById('lobby-coins').textContent = gameData.coins;
    document.getElementById('gameover').classList.remove('show');
    document.getElementById('lobby').classList.add('show');
}

// Start
document.getElementById('lobby-coins').textContent = gameData.coins;
</script>
</body>
</html>
