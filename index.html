<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐡 דג הבלון</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body {
        background: #001020;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        touch-action: none;
        user-select: none;
    }
    canvas { display:block; position:fixed; top:0; left:0; z-index:1; }

    /* Bigger HUD */
    .hud {
        position: fixed; top: 0; left: 0; right: 0;
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px; z-index: 10; pointer-events: none;
        font-size: 18px;
    }
    .hud-item {
        background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.15); border-radius: 50px;
        padding: 8px 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    }
    #pause-btn {
        pointer-events: auto; cursor: pointer;
        background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%; width: 48px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; color: #fff;
    }

    .overlay {
        position: fixed; inset: 0;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 100; gap: 15px; background: rgba(0,10,35,0.96); backdrop-filter: blur(12px);
    }
    .overlay.show { display: flex; }

    .btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white; border: none; padding: 16px 40px; font-size: 18px; font-weight: 700;
        border-radius: 16px; cursor: pointer; min-width: 240px;
    }
    .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); }

    #lobby h1 { font-size: 52px; margin-bottom: 10px; }
    #shop, #ability-shop { padding: 20px; overflow-y: auto; }
    .skin-grid, .ability-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 15px; max-width: 600px; width: 100%;
    }
    .skin-card {
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
        border-radius: 16px; padding: 12px; text-align: center; cursor: pointer; font-size: 15px;
    }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby" class="overlay show">
    <h1>🐡 דג הבלון</h1>
    <p class="sub" style="color:rgba(255,255,255,0.6);font-size:16px;">אסוף דגים • היזהר מכרישים • הילחם בבוס</p>
    <p class="saved-coins" style="font-size:24px;">💰 <span id="lobby-coins">0</span> מטבעות</p>
    
    <button class="btn" onclick="startGame()">🎮 התחל משחק</button>
    <button class="btn btn-shop" onclick="openShop()">🛒 חנות סקינים</button>
    <button class="btn btn-ability" onclick="openAbilityShop()">⚡ חנות יכולות</button>
    <button class="btn btn-secondary" onclick="openSettings()">⚙️ הגדרות</button>
</div>

<!-- GAME OVER -->
<div id="gameover" class="overlay">
    <h2 style="font-size:36px;color:#f87171;">💀 נפסלת!</h2>
    <p style="font-size:18px;">ניקוד <span id="go-score">0</span> | שלב <span id="go-level">1</span></p>
    <p style="color:#ffd700;font-size:24px;">+<span id="go-earned">0</span> 🪙</p>
    <button class="btn" onclick="startGame()">🔄 שחק שוב</button>
    <button class="btn btn-secondary" onclick="goLobby()">🏠 לובי</button>
</div>

<!-- PAUSE -->
<div id="pause-screen" class="overlay">
    <h2 style="font-size:38px;">⏸️ השהייה</h2>
    <button class="btn" onclick="resumeGame()">▶️ המשך</button>
    <button class="btn btn-secondary" onclick="quitToLobby()">🏠 חזור ללובי</button>
</div>

<!-- LEVEL COMPLETE -->
<div id="level-complete" class="overlay">
    <h2 style="font-size:42px;">🎉 כל הכבוד!</h2>
    <div id="lc-level" style="font-size:80px;font-weight:900;">2</div>
    <p style="font-size:20px;">+<span id="lc-reward">15</span> 🪙 בונוס</p>
    <button class="btn" onclick="dismissLevelComplete()">🚀 המשך למשחק</button>
</div>

<!-- SHOP -->
<div id="shop" class="overlay">
    <h2>🛒 חנות סקינים</h2>
    <p style="font-size:18px;">💰 <span id="shop-coins">0</span> מטבעות</p>
    <div class="skin-grid" id="skin-grid"></div>
    <button class="btn btn-secondary" onclick="closeShop()">חזור</button>
</div>

<!-- ABILITY SHOP -->
<div id="ability-shop" class="overlay">
    <h2>⚡ חנות יכולות</h2>
    <p style="font-size:18px;">💰 <span id="ability-shop-coins">0</span> מטבעות</p>
    <div class="ability-grid" id="ability-grid"></div>
    <button class="btn btn-secondary" onclick="closeAbilityShop()">חזור</button>
</div>

<!-- SETTINGS -->
<div id="settings" class="overlay">
    <h2>⚙️ הגדרות</h2>
    <button class="btn btn-secondary" onclick="closeSettings()">חזור</button>
</div>

<!-- HUD -->
<div class="hud" id="hud" style="display:none;">
    <div style="display:flex;gap:12px;">
        <div class="hud-item">🪙 <span id="hud-coins">0</span></div>
        <div class="hud-item">⭐ <span id="hud-score">0</span></div>
        <div class="hud-item">שלב <span id="hud-level">1</span></div>
    </div>
    <div id="pause-btn" onclick="togglePause()">⏸</div>
</div>

<canvas id="game"></canvas>

<script>
// ==================== CORE GAME ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; });

let gameData = { coins: 800, ownedSkins:["classic"], equippedSkin:"classic", playerSpeed:3.2 };
function saveData(){ localStorage.setItem('puff_save', JSON.stringify(gameData)); }
if(localStorage.getItem('puff_save')) gameData = JSON.parse(localStorage.getItem('puff_save'));

const SKINS = [
    {id:"classic",name:"קלאסי",price:0,bodyColor:"#ffcc00",inflatedColor:"#ff8800"},
    {id:"ocean",name:"אוקיינוס",price:60,bodyColor:"#00bfff",inflatedColor:"#0099ff"},
    {id:"frost",name:"קרח",price:90,bodyColor:"#81d4fa",inflatedColor:"#4fc3f7"},
    {id:"lava",name:"לבה",price:110,bodyColor:"#ff4444",inflatedColor:"#ff6600"},
    {id:"toxic",name:"רעיל",price:130,bodyColor:"#39ff14",inflatedColor:"#00ff00"},
    {id:"golden",name:"זהב",price:350,bodyColor:"#ffd700",inflatedColor:"#ffaa00"}
];

let player, fishList=[], sharks=[], score=0, earnedCoins=0, level=1, gameRunning=false, paused=false;

function initGame(){
    player = {x:W/2, y:H/2, size:28, inflated:false};
    fishList=[]; sharks=[]; score=0; earnedCoins=0; level=1;
}

function drawPuffer(){
    if(!player) return;
    ctx.save();
    ctx.translate(player.x, player.y);
    const skin = SKINS.find(s=>s.id===gameData.equippedSkin) || SKINS[0];
    const r = player.inflated ? player.size*1.9 : player.size;
    
    ctx.shadowBlur = 30;
    ctx.shadowColor = skin.bodyColor;
    ctx.fillStyle = player.inflated ? skin.inflatedColor : skin.bodyColor;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();
    
    if(player.inflated){
        ctx.strokeStyle = "#cc6600";
        ctx.lineWidth = 4;
        for(let i=0;i<12;i++){
            let a = i*Math.PI*2/12;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
            ctx.lineTo(Math.cos(a)*(r+18), Math.sin(a)*(r+18));
            ctx.stroke();
        }
    }
    ctx.restore();
}

function gameLoop(){
    if(!gameRunning || paused) return;
    requestAnimationFrame(gameLoop);
    
    ctx.fillStyle = "#001830";
    ctx.fillRect(0,0,W,H);
    
    // Simple movement
    if(keys['w']||keys['ArrowUp']) player.y -= 6;
    if(keys['s']||keys['ArrowDown']) player.y += 6;
    if(keys['a']||keys['ArrowLeft']) player.x -= 6;
    if(keys['d']||keys['ArrowRight']) player.x += 6;
    if(keys[' ']) player.inflated = true; else player.inflated = false;
    
    player.x = Math.max(30, Math.min(W-30, player.x));
    player.y = Math.max(30, Math.min(H-30, player.y));
    
    drawPuffer();
    
    // Fish
    fishList.forEach((f,i)=>{
        f.x += f.vx||1; f.y += f.vy||0.5;
        ctx.fillStyle = f.color||"#ffeb3b";
        ctx.beginPath(); ctx.arc(f.x,f.y,12,0,Math.PI*2); ctx.fill();
        if(Math.hypot(f.x-player.x,f.y-player.y)<35){
            earnedCoins++; score++;
            fishList.splice(i,1);
            document.getElementById('hud-coins').textContent = earnedCoins;
            document.getElementById('hud-score').textContent = score;
        }
    });
    
    document.getElementById('hud-level').textContent = level;
}

// Controls
let keys = {};
window.addEventListener('keydown', e=> keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

// UI Functions
function startGame(){
    document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
    document.getElementById('hud').style.display='flex';
    initGame();
    gameRunning = true;
    setInterval(()=>{ if(gameRunning) fishList.push({x:Math.random()*W, y:Math.random()*H, vx:1.5, color:'#ffeb3b'}); }, 300);
    setInterval(()=>{ if(gameRunning && sharks.length<4) sharks.push({x:Math.random()*W,y:-50}); }, 1200);
    gameLoop();
}

function die(){
    gameRunning=false;
    document.getElementById('hud').style.display='none';
    gameData.coins += earnedCoins;
    saveData();
    document.getElementById('go-score').textContent=score;
    document.getElementById('go-level').textContent=level;
    document.getElementById('go-earned').textContent=earnedCoins;
    document.getElementById('gameover').classList.add('show');
}

function goLobby(){ location.reload(); }
function togglePause(){ paused=!paused; }
function resumeGame(){ paused=false; }
function quitToLobby(){ location.reload(); }
function dismissLevelComplete(){ /* continue */ document.getElementById('level-complete').classList.remove('show'); level++; }

// Shops
function openShop(){
    document.getElementById('shop-coins').textContent = gameData.coins;
    const grid = document.getElementById('skin-grid');
    grid.innerHTML = '';
    SKINS.forEach(s=>{
        const div = document.createElement('div');
        div.className='skin-card';
        div.innerHTML = `<div style="width:70px;height:70px;border-radius:50%;background:${s.bodyColor};margin:auto"></div><div>${s.name}</div>`;
        div.onclick = ()=>{ gameData.equippedSkin = s.id; saveData(); openShop(); };
        grid.appendChild(div);
    });
    document.getElementById('shop').classList.add('show');
}
function closeShop(){ document.getElementById('shop').classList.remove('show'); }

function openAbilityShop(){
    document.getElementById('ability-shop-coins').textContent = gameData.coins;
    document.getElementById('ability-shop').classList.add('show');
}
function closeAbilityShop(){ document.getElementById('ability-shop').classList.remove('show'); }

function openSettings(){ document.getElementById('settings').classList.add('show'); }
function closeSettings(){ document.getElementById('settings').classList.remove('show'); }

// Start
document.getElementById('lobby-coins').textContent = gameData.coins;
</script>
</body>
</html>
